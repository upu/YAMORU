name: Quality checks

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

# 同じPRへ短時間に複数回pushすると、古いワークフロー実行がキャンセルされず
# 並走し続けていた(#86)。pull_requestだけ古い実行を自動キャンセルし、
# push(main)やworkflow_call(production release)では進行中のビルドを
# 誤って取り消さない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  d1:
    name: D1 migration and authorization tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations to a clean local database
        run: npm run d1:migrate

      - name: Test household isolation and atomic operations on D1
        run: npm run test:d1
