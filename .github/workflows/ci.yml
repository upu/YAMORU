name: Quality checks

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

# 同じPRへ短時間に複数回pushすると、古いワークフロー実行がキャンセルされず
# 並走し続けていた(#86)。pull_requestだけ古い実行を自動キャンセルし、
# push(main)やworkflow_call(production release)では進行中のビルドを
# 誤って取り消さない。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Lint・Typecheck・Test・Buildを一つのjobで直列に実行していたため、
# セットアップを除く79秒がそのままworkflowの実時間になっていた(#274)。
# npm test単独(41秒)とそれ以外の合計(38秒)がほぼ拮抗しているため、
# この2つを並列jobへ分けるだけで実時間が最短に近づく。checkoutと
# npm ciの26秒を各jobが払うので、これ以上細かく分けても実時間は
# 変わらず、課金対象のランナー時間だけが増える。
jobs:
  static:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  test:
    name: Unit and component tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test
        run: npm test

  d1:
    name: D1 migration and authorization tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Apply D1 migrations to a clean local database
        run: npm run d1:migrate

      - name: Test household isolation and atomic operations on D1
        run: npm run test:d1
