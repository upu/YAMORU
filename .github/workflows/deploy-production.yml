name: Deploy production

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: yamoru-production
  cancel-in-progress: false

jobs:
  quality:
    if: >-
      github.event.release.draft == false &&
      github.event.release.prerelease == false
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.YAMORU_PRODUCTION_URL }}
    env:
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify stable Release target
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-target.ts

      - name: Install dependencies
        run: npm ci

      - name: Check production target separation
        run: npm run cf:config:check

      - name: Apply production D1 migrations
        run: npm run d1:migrate:production

      - name: Build the Cloudflare Worker
        run: npm run cf:build

      - name: Deploy the released Worker
        run: npm run cf:deploy:production

      - name: Verify public assets and authentication boundary
        run: npm run cf:smoke -- "${{ vars.YAMORU_PRODUCTION_URL }}"
