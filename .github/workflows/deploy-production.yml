name: Deploy production

on:
  workflow_run:
    workflows: ["Quality checks"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: yamoru-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.YAMORU_PRODUCTION_URL }}
    env:
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check production target separation
        run: npm run cf:config:check

      - name: Apply production D1 migrations
        run: npm run d1:migrate:production

      - name: Build the Cloudflare Worker
        run: npm run cf:build

      - name: Deploy the verified Worker
        run: npm run cf:deploy:production

      - name: Verify public assets and authentication boundary
        run: npm run cf:smoke -- "${{ vars.YAMORU_PRODUCTION_URL }}"
