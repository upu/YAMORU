name: Preview family sharing E2E

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "検証するDraft Releaseのtag名(vX.Y.Z)"
        required: true
        type: string
      target_sha:
        description: "Draft Releaseが対象にするmain commitの完全なSHA"
        required: true
        type: string

permissions:
  contents: read

# deploy-preview.ymlと同じgroupを共有し、preview環境への新しいdeployと
# このE2Eが同時に走らないようにする(#151)。
concurrency:
  group: yamoru-preview
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
      url: ${{ vars.YAMORU_PREVIEW_URL }}
    env:
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YAMORU_PREVIEW_URL: ${{ vars.YAMORU_PREVIEW_URL }}

    steps:
      # GitHub ActionsはDraft Releaseのcreatedイベントを発火せず、GITHUB_TOKENは
      # Draftを取得できないため、運用者が照合したtagとSHAを明示して実行する(#167)。
      - name: Verify the Draft Release target
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be stable SemVer (vX.Y.Z): $RELEASE_TAG"
            exit 1
          fi
          if [[ ! "$RELEASE_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Draft target must be a full commit SHA: $RELEASE_TARGET_SHA"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Workflow must be dispatched from main: $GITHUB_REF"
            exit 1
          fi
          if [ "$RELEASE_TARGET_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Draft target $RELEASE_TARGET_SHA is not the dispatched main commit $GITHUB_SHA"
            exit 1
          fi

          echo "target_sha=$RELEASE_TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release candidate::$RELEASE_TAG targets $RELEASE_TARGET_SHA"

      - name: Check out the Release candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.target_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify family sharing flows on the deployed preview
        run: npm run test:e2e:preview
