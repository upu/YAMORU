name: Preview family sharing E2E

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "検証するDraft Releaseのtag名(vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

# deploy-preview.ymlと同じgroupを共有し、preview環境への新しいdeployと
# このE2Eが同時に走らないようにする(#151)。
concurrency:
  group: yamoru-preview
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
      url: ${{ vars.YAMORU_PREVIEW_URL }}
    env:
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YAMORU_PREVIEW_URL: ${{ vars.YAMORU_PREVIEW_URL }}

    steps:
      # GitHub ActionsはDraft Releaseのcreatedイベントを発火しないため、
      # Draft保存後に明示実行し、API上の対象commitをここで確定する(#167)。
      - name: Resolve the Draft Release target
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be stable SemVer (vX.Y.Z): $RELEASE_TAG"
            exit 1
          fi

          draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.draft')
          target_sha=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.target_commitish')
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')

          if [ "$draft" != "true" ]; then
            echo "::error::Release $RELEASE_TAG is not a Draft"
            exit 1
          fi
          if [[ ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Draft target_commitish must be a full commit SHA: $target_sha"
            exit 1
          fi
          if [ "$target_sha" != "$main_sha" ]; then
            echo "::error::Draft target $target_sha is not the latest main commit $main_sha"
            exit 1
          fi

          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release candidate::$RELEASE_TAG targets $target_sha"

      - name: Check out the Release candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.target_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify family sharing flows on the deployed preview
        run: npm run test:e2e:preview
