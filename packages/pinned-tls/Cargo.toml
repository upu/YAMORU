[package]
name = "yamoru-pinned-tls"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "tls"
crate-type = ["cdylib"]

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
ring = { version = "=0.17.14", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "=1.15.1", features = ["web"] }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
webpki-roots = "=1.0.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
